[project]
name = "activity-digest"
version = "0.1.0"
description = "Weekly activity digest pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2,<3",
    "httpx>=0.27,<1",
    "Markdown>=3.7,<4",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
